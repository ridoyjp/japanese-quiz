<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japanese Lesson 1 Quiz</title><style>body{font-family:system-ui,'Noto Sans Bengali',sans-serif;background:#edf3fb;color:#17365b;margin:0}main{max-width:720px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #17365b12}h1{font-size:25px}button{border:0;border-radius:12px;padding:13px 16px;background:#17365b;color:white;font-size:16px;cursor:pointer}button:disabled{opacity:.45}.option{display:block;width:100%;margin:9px 0;text-align:left;background:#eaf1fa;color:#17365b}.selected{background:#9dc6ff}.correct{background:#b5ecc6}.wrong{background:#ffc8c8}.muted{color:#61738b}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:10px;background:#dce6f3;border-radius:20px;overflow:hidden}.fill{height:100%;background:#2677d6;width:0}#result{display:none}label{display:block;margin:12px 0}select{padding:10px;border-radius:9px;width:100%;font-size:16px}small{color:#657b95}</style></head><body><main><div class="card"><h1>🇯🇵 Japanese Lesson 1 — বাংলা কুইজ</h1><p>৪৭টি শব্দ • জাপানি → বাংলা • মোবাইলেই পরীক্ষা ও ফলাফল</p><label>প্রশ্নের ধরন <select id="mode"><option value="all">সব ৪৭টি প্রশ্ন</option><option value="random">এলোমেলো ২০টি প্রশ্ন</option></select></label><button id="start">পরীক্ষা শুরু করুন</button></div><div id="quiz" style="display:none"><div class="card"><div class="top"><b id="counter"></b><span id="score"></span></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question"></h2><div id="options"></div><button id="next" disabled>পরের প্রশ্ন →</button></div></div><div id="result" class="card"><h2>🎉 পরীক্ষার ফলাফল</h2><h1 id="summary"></h1><p id="percent"></p><div id="review"></div><button onclick="location.reload()">আবার পরীক্ষা দিন</button></div><small>উত্তর বেছে নিলেই সঠিক/ভুল দেখাবে। সবশেষে ভুল উত্তরগুলোর তালিকা পাবেন।</small></main><script>
const data=[
['わたし','আমি'],['わたしたち','আমরা'],['あなた','তুমি / আপনি'],['あのひと','ওই ব্যক্তি'],['あのかた','ওই ব্যক্তি (সম্মানসূচক)'],['みなさん','সবাই'],['さん','সম্মানসূচক সম্বোধন'],['ちゃん','আদরসূচক প্রত্যয়'],['くん','ছেলেদের নামের প্রত্যয়'],['じん','জাতীয়তা বোঝায়'],['せんせい','শিক্ষক (সম্বোধন)'],['きょうし','শিক্ষক (পেশা)'],['がくせい','ছাত্র / ছাত্রী'],['かいしゃいん','কোম্পানির কর্মচারী'],['しゃいん','কোম্পানির কর্মী'],['ぎんこういん','ব্যাংকের কর্মচারী'],['いしゃ','ডাক্তার'],['けんきゅうしゃ','গবেষক'],['エンジニア','ইঞ্জিনিয়ার'],['だいがく','বিশ্ববিদ্যালয়'],['びょういん','হাসপাতাল'],['でんき','বিদ্যুৎ / আলো'],['だれ','কে'],['どなた','কে (সম্মানসূচক)'],['～さい','~ বছর বয়স'],['なんさい','বয়স কত?'],['おいくつ','বয়স কত? (সম্মানসূচক)'],['はい','হ্যাঁ'],['いいえ','না'],['しつれいですが','মাফ করবেন, কিন্তু...'],['おなまえは？','আপনার নাম কী?'],['はじめまして','প্রথম পরিচয়ে শুভেচ্ছা'],['どうぞよろしく','পরিচিত হয়ে ভালো লাগল'],['～からきました','~ থেকে এসেছি'],['アメリカ','আমেরিকা / যুক্তরাষ্ট্র'],['イギリス','ইংল্যান্ড / যুক্তরাজ্য'],['インド','ভারত'],['インドネシア','ইন্দোনেশিয়া'],['かんこく','দক্ষিণ কোরিয়া'],['ちゅうごく','চীন'],['ドイツ','জার্মানি'],['フランス','ফ্রান্স'],['ブラジル','ব্রাজিল'],['にほん','জাপান'],['バングラデシュ','বাংলাদেশ'],['なまえ','নাম'],['ともだち','বন্ধু']];
let questions=[],idx=0,answers=[],locked=false;const $=id=>document.getElementById(id);const shuffle=a=>a.sort(()=>Math.random()-.5);$('start').onclick=()=>{questions=shuffle([...data].map((d,i)=>({d,i})));if($('mode').value==='random')questions=questions.slice(0,20);idx=0;answers=[];$('quiz').style.display='block';$('result').style.display='none';$('start').disabled=true;render();$('quiz').scrollIntoView({behavior:'smooth'})};function render(){locked=false;$('next').disabled=true;let q=questions[idx];$('counter').textContent=`প্রশ্ন ${idx+1} / ${questions.length}`;$('score').textContent=`সঠিক: ${answers.filter(a=>a.ok).length}`;$('fill').style.width=`${idx/questions.length*100}%`;$('question').textContent=`「${q.d[0]}」 এর বাংলা অর্থ কী?`;let distract=shuffle(data.filter((d,i)=>i!==q.i&&d[1]!==q.d[1]).map(d=>d[1])).slice(0,3);let opts=shuffle([q.d[1],...distract]);$('options').innerHTML='';opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>choose(o);$('options').appendChild(b)});$('next').textContent=idx===questions.length-1?'ফলাফল দেখুন':'পরের প্রশ্ন →'}function choose(value){if(locked)return;locked=true;let correct=questions[idx].d[1],ok=value===correct;answers.push({j:questions[idx].d[0],value,correct,ok});[...$('options').children].forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct');else if(b.textContent===value)b.classList.add('wrong')});$('next').disabled=false;$('score').textContent=`সঠিক: ${answers.filter(a=>a.ok).length}`} $('next').onclick=()=>{idx++;if(idx<questions.length)render();else finish()};function finish(){$('quiz').style.display='none';$('result').style.display='block';let right=answers.filter(a=>a.ok).length,wrong=answers.length-right;$('summary').textContent=`সঠিক ${right}টি | ভুল ${wrong}টি`;$('percent').textContent=`স্কোর: ${Math.round(right/answers.length*100)}%`;let mistakes=answers.filter(a=>!a.ok);$('review').innerHTML=mistakes.length?'<h3>❌ ভুল উত্তরগুলো ও সঠিক অর্থ</h3>':'<p>অভিনন্দন! সব উত্তর সঠিক! 🏆</p>';mistakes.forEach(a=>{let p=document.createElement('p');p.textContent=`${a.j} — আপনার উত্তর: ${a.value} | সঠিক: ${a.correct}`;$('review').appendChild(p)});$('result').scrollIntoView({behavior:'smooth'})}
</script></body></html>
